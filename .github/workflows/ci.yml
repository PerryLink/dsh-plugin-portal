name: CI

# The portal is a zero-dependency static site: no install step, no build step and
# no artifact to publish. `npm test` only aliases the gate from package.json and
# installs nothing. The gate is the whole pipeline and self-asserts that it
# imports nothing but `node:` builtins.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Roster contract, inline-script parse/run, blurb coverage, badge owner
      # derivation, README count governance, adoption levels, the mirrored
      # attestation index, and both static pages. The upstream-parity check
      # reports `skip` here because the sibling dsh-plugin-kit checkout does not
      # exist on this runner - it must not fail CI for something the runner
      # cannot fix.
      - name: Portal gate
        run: npm test
